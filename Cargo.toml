[workspace]
resolver = "2"
members = [
    "crates/atlasoq-core",
    "crates/atlasoq-pty",
    "crates/atlasoq-store",
    "crates/atlasoq-link",
    "crates/atlasoq-cli",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
authors = ["AtlasOQ contributors"]

[workspace.dependencies]
atlasoq-core = { path = "crates/atlasoq-core" }
atlasoq-pty = { path = "crates/atlasoq-pty" }
atlasoq-store = { path = "crates/atlasoq-store" }
atlasoq-link = { path = "crates/atlasoq-link" }

anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
portable-pty = "0.9.0"
vt100 = "0.16.2"
notify = "8.2.0"
nix = { version = "0.31.3", features = ["process", "signal", "fs", "socket", "user"] }
libc = "0.2.190"
keyring = "4.2.0"
ulid = "3.0.0"
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.3"
strsim = "0.11.1"
clap = { version = "4.6.7", features = ["derive"] }
tauri = "2.12.3"
tauri-build = "2.7.2"
tauri-plugin-dialog = "2.8.2"

assert_cmd = "2.2.2"
insta = "1.49.0"
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
