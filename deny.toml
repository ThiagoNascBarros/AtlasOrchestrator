# Verificação de licenças e avisos de segurança (constituição, princípio I).
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # proc-macro-error: sem manutenção, dependência transitiva do Tauri via gtk-rs (GTK3).
    # Reavaliar quando o Tauri migrar para GTK4.
    { id = "RUSTSEC-2024-0370", reason = "transitiva do Tauri, sem alternativa no momento" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "MPL-2.0",
    "Unlicense",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
