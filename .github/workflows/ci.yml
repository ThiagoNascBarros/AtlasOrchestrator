name: CI

on:
  push:
    branches: [main, "ATQ-*"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Build da UI (necessário para o build do app)
        run: |
          corepack enable pnpm
          pnpm -C app install --frozen-lockfile
          pnpm -C app/ui build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: EmbarkStudios/cargo-deny-action@v2

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable pnpm
      - run: pnpm -C app install --frozen-lockfile
      - run: pnpm -C app/ui lint
      - run: pnpm -C app/ui exec tsc --noEmit
      - run: pnpm -C app/ui test
      - run: pnpm -C app/ui licenses
